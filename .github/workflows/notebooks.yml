name: Notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:

jobs:
  execute:
    name: Execute example notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci/notebooks.yaml
          micromamba-version: 'latest'

      - name: install package
        run: pip install -e . --no-deps

      - name: register python3 kernel
        run: python -m ipykernel install --user --name python3

      # The network-distance cells in notebooks 01, 02 and 04 (optional
      # `pandarm`/`hvplot` dependencies) are tagged `skip-execution`.
      - name: execute notebooks with nbmake
        run: |
          pytest --nbmake --nbmake-timeout=900 -v notebooks/
